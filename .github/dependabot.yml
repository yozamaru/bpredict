# 依存の更新を weekly で受ける（基本設計 7.3）。
#
# npm は package.json があるディレクトリだけ登録する。存在しないディレクトリを
# 指定すると Dependabot がエラーを出し続けるため、web/ は工程11で追記する。
version: 2
updates:
  - package-ecosystem: pip
    directory: /batch
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
