# push / PR で必ず実行する（基本設計 7.2）。
#
# 最重要の test_leakage.py を人間の規律に任せると3ヶ月で形骸化するため、CI で強制する。
# api / web はディレクトリができた時点で自動的に有効になる（detect ジョブの出力で分岐）。
name: ci

on:
  push:
  pull_request:

# 既定は contents: read。write を与えるのは daily-ingest と gameday-update だけ
# （CLAUDE.md 絶対ルール4 / 詳細設計 4.1）
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 存在するディレクトリを調べ、下流のジョブの実行可否を決める。
  # job 単位の `if: hashFiles(...)` は checkout 前に評価され常に偽になるため使えない。
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.dirs.outputs.api }}
      web: ${{ steps.dirs.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - id: dirs
        run: |
          echo "api=$([ -f api/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            batch/requirements.txt
            batch/requirements-dev.txt
      # 実行時依存（pandas / pyarrow）もテストに必要。特徴量生成の入力が Parquet のため
      - run: pip install -r batch/requirements.txt -r batch/requirements-dev.txt
      - name: ruff
        run: ruff check batch
      - name: mypy
        run: mypy
      # **pytest の出力を Actions のログへ直接流さない。**
      # 工程5のブランチで、`-v` でログへ直接出す構成が 3 回中 3 回停止した
      # （SIGABRT も SIGKILL も効かず、job の timeout-minutes すら遅延した）。
      # 一方、ファイルへリダイレクトした全件実行と、`-q` に分けた 8 ステップは
      # すべて成功した。fsync を外しても再発したため原因は pytest 側ではなく、
      # ランナーのログ取り込み側と見ている（未特定）。
      # 実績のある構成に寄せ、結果は末尾だけをログへ出す。停止した場合は
      # SIGABRT で faulthandler のスタックを出し、効かなければ強制終了する。
      - name: pytest
        env:
          PYTHONFAULTHANDLER: '1'
        run: |
          set +e
          timeout -k 30 -s ABRT 300 pytest batch/tests -q > pytest.log 2>&1
          code=$?
          set -e
          tail -n 80 pytest.log
          if [ "$code" -ne 0 ]; then
            grep -nE 'File \"|Thread |Current thread|failed|error' pytest.log \
              | tail -n 20 | sed 's/^/::error::/'
          fi
          exit "$code"

  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # 取得したレスポンス本文のコミットと、fixtures への実サイト由来文字列の混入を検査する
      # （受け入れ基準 A-12 / 要件 4.5.2）
      - name: fixtures に実サイト由来の文字列がないこと
        run: python scripts/check_fixtures.py

  api:
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 要件 7章 の「Node.js 20.9+」は Next.js 16 の下限である。
          # 開発ツールチェーンの下限はこれより高い（wrangler が >=22、
          # eslint が ^20.19 || ^22.13 || >=24）。手元と CI を揃えて 24 を使う。
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # `wrangler types` の生成物はコミットしない（.dev.vars を読むため環境依存）。
      # typecheck が先に生成するため、以降のステップもこの型を使える。
      - run: npm run typecheck
      # next lint は Next.js 16 で削除されている。eslint を直接呼ぶ（CLAUDE.md）
      - run: npm run lint
      - run: npm run test

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 要件 7章 の「Node.js 20.9+」は Next.js 16 の下限である。
          # 開発ツールチェーンの下限はこれより高い（wrangler が >=22、
          # eslint が ^20.19 || ^22.13 || >=24）。手元と CI を揃えて 24 を使う。
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      # 両テーマのコントラスト比 4.5:1 以上をトークンの単体検査で確かめる
      # （基本設計 6.1。目視のスナップショット確認では必ず見落とす）
      - run: npm run test:tokens
      - run: npm run build
      # Pages の1デプロイ20,000ファイル上限に対する検査（受け入れ基準 A-14）
      - name: out/ のファイル数が 18,000 以下であること
        run: |
          n=$(find out -type f | wc -l)
          echo "out/ のファイル数: $n"
          test "$n" -le 18000
      # 初期JS の予算（gzip 180KB 以下。要件 4.2）。ライブラリを1つ足すと一気に超える
      - run: npm run test:budget
      # 内部リンクに実体があること。**静的出力では `generateStaticParams` への
      # 足し忘れが 404 になり、目視では気づけない**（実際に18件壊れていた）。
      # 受け入れ基準 A-07（免責が全ページから到達可能）の一部もここで守る
      - run: npm run test:links
