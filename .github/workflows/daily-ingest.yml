# 日次の取り込みと推論（詳細設計 4.2）。
#
# **1日4回回す**（運営者の指示。2026-10-05。詳細設計 4.2）。
#
# | cron (UTC) | JST | ステップ |
# |---|---|---|
# | `0 21 * * *` | **06:00** | **すべて**（1 / 1b / 3 / 4 / 5） |
# | `0 2,4,7 * * *` | 11:00 / 13:00 / 16:00 | 1 / 3 / 4 / 5 |
#
# **06:00 以外ではステップ1b を回さない。** 日程の walk を1回節約する
# （要件 5.2「取得は必要最小限のページに限る」）。未実施の試合の追加・延期は
# 1日1回の反映で足りる。
#
# **ワークフローを2つに分けない。** 設計 4.1 は `gameday_update` を別ジョブとして
# 定めるが、**エントリー取得が未実装である今、行う処理は同じ**である。同じコマンドを
# 呼ぶワークフローを2つ持つと cron 以外に違いがなく、**片方だけ直す事故**が増える。
#
# **`schedule` では `inputs` が空になる。** 真偽値の入力も `''` になるため、
# `inputs.results` をそのまま使うと**全ステップが false になりジョブがエラーで
# 終わる**。`github.event_name == 'schedule'` を先に見る。どのステップを回すかは
# **`github.event.schedule`（cron 式そのもの）で分ける。**
#
# **`contents: write` を与える2つのワークフローのうちの1つ**（基本設計 7.3）。
# スナップショット（ステップ2）と静的JSON（ステップ5）をコミットするために要る。
# 残りは `contents: read` のままにする。
#
# **どのステップを行うかを必ず指定させる**（`daily_ingest` が required にしている）。
# 全ステップが揃うまで既定の動作を持たせない — 「回したつもりで半分しか動いて
# いない」が最も危ない。
name: daily-ingest

on:
  # **UTC で書く**（CLAUDE.md 時刻の扱い）。06:00 / 11:00 / 13:00 / 16:00 JST。
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 2,4,7 * * *'
  workflow_dispatch:
    inputs:
      results:
        description: '結果を取り込む（ステップ1 と2。窓は [前日, 当日]。公式サイトへ取得する）'
        required: false
        type: boolean
        default: true
      upcoming:
        description: '未実施の試合を取り込む（ステップ1b と2。公式サイトへ取得する）'
        required: false
        type: boolean
        default: true
      settle:
        description: '照合・集計・Elo 再計算（ステップ3）。外部アクセスなし'
        required: false
        type: boolean
        default: true
      inference:
        description: '推論と静的JSON の書き出し（ステップ4と5）'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'D1 には書かない（コミットもしない）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# D1 へ書き込むジョブの同時実行を禁止する（詳細設計 4.1）。
# **走行中を殺さない。** 殺されたジョブは `batch()` の途中で止まる。
concurrency:
  group: d1-write
  cancel-in-progress: false

jobs:
  ingest:
    # 手動実行も既定ブランチだけに限る。別ブランチのコードで本番 D1 へ書かない。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      SCRAPER_USER_AGENT: ${{ vars.SCRAPER_USER_AGENT }}
      SCRAPER_ROBOTS_SHA256: ${{ vars.SCRAPER_ROBOTS_SHA256 }}
      SCRAPER_TERMS_SHA256: ${{ vars.SCRAPER_TERMS_SHA256 }}
      SCRAPER_STATE_PATH: batch/.scraper-state/state.json
    steps:
      - uses: actions/checkout@v7

      # 未設定のまま走らせない。**skip ではなく fail にする**（手動実行なので、
      # 黙って通り過ぎるよりその場で気づける方がよい。backfill と同じ扱い）。
      # 空の User-Agent や規約ハッシュ未確認で取得すると絶対ルール6を破る。
      - name: 設定の確認
        env:
          RESULTS: ${{ github.event_name == 'schedule' || inputs.results }}
          UPCOMING: ${{ github.event_name == 'schedule' || inputs.upcoming }}
        shell: bash
        run: |
          missing=()
          for name in API_BASE_URL INGEST_TOKEN; do
            [[ -z "${!name}" ]] && missing+=("$name")
          done
          if [[ "$RESULTS" == 'true' || "$UPCOMING" == 'true' ]]; then
            for name in SCRAPER_USER_AGENT SCRAPER_ROBOTS_SHA256 SCRAPER_TERMS_SHA256; do
              [[ -z "${!name}" ]] && missing+=("$name")
            done
          fi
          if (( ${#missing[@]} )); then
            printf '::error::未設定: %s\n' "${missing[*]}"
            exit 1
          fi

      # スクレイパの状態（日次3,000件のカウンタと 429/503 後の停止）を実行間で
      # 引き継ぐ。`parser-canary` / `backfill` と同じキー空間を共有し、
      # **合計で上限を守る**（詳細設計 4.8）。
      - name: スクレイパの状態を復元
        if: ${{ github.event_name == 'schedule' || inputs.results || inputs.upcoming }}
        uses: actions/cache@v6
        with:
          path: batch/.scraper-state
          key: scraper-state-${{ github.run_id }}
          restore-keys: |
            scraper-state-

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r batch/requirements.txt

      # inputs を `run:` に直接展開しない（env へ渡す）。
      - name: 取り込みと推論
        env:
          RESULTS: ${{ github.event_name == 'schedule' || inputs.results }}
          # **ステップ1b は 06:00 だけ**（日程の walk を節約する。詳細設計 4.2）
          UPCOMING: ${{ github.event_name == 'schedule' && github.event.schedule == '0 21 * * *' || github.event_name != 'schedule' && inputs.upcoming }}
          SETTLE: ${{ github.event_name == 'schedule' || inputs.settle }}
          INFERENCE: ${{ github.event_name == 'schedule' || inputs.inference }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          [[ "$RESULTS" == 'true' ]] && args+=(--only-results)
          [[ "$UPCOMING" == 'true' ]] && args+=(--only-upcoming)
          [[ "$SETTLE" == 'true' ]] && args+=(--only-settle)
          [[ "$INFERENCE" == 'true' ]] && args+=(--only-inference)
          [[ "$DRY_RUN" == 'true' ]] && args+=(--dry-run)
          if (( ${#args[@]} == 0 )); then
            echo '::error::ステップを1つ以上選ぶ（results / upcoming / settle / inference）'
            exit 1
          fi
          python -m batch.jobs.daily_ingest "${args[@]}"

      # **スナップショットと静的JSON をコミットする**（基本設計 1.2 の構成図）。
      # 変わっていなければ何もしない（空のコミットを積まない）。
      - name: スナップショットと静的JSON をコミット
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # **存在するものだけを add する。** `web/public/data` は初回の
          # 書き出しまで無く、`git add` は無いパスで exit 128 になる
          # **取り込まない試合の一覧も入れる**（要件 5.3）。`backfill` は
          # `contents: read` のため artifact で持ち帰るしかないが、このジョブは
          # 自分でコミットできる
          for path in batch/snapshot web/public/data batch/exclusions; do
            [[ -e "$path" ]] && git add "$path"
          done
          if git diff --cached --quiet; then
            echo '変更なし'
            exit 0
          fi
          git commit -m "データ: daily-ingest の書き出し（run ${GITHUB_RUN_ID}）"
          git push

      # 取り込まない試合の一覧（不戦敗）を持ち帰る。**`daily_ingest` は
      # `contents: write` なので上のコミットに含まれる**が、`PARTIAL` で
      # 途中終了した回のぶんも拾えるようにしておく（詳細設計 4.4）。
      - name: 取り込まない試合の一覧
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excluded-games
          path: batch/exclusions/excluded_games.json
          if-no-files-found: ignore
