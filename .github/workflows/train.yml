# 勝敗モデルの学習・評価・登録（詳細設計 4.5 / 4.5.1 / 4.6）。
#
# **外部アクセスをしない。** 入力はスナップショット（`batch/snapshot/*.parquet`）で、
# 出力は `POST /internal/models` である。したがってスクレイピングの関門は要らない。
#
# **cron は `0 19 1 * *`（JST 2日04:00）である**（設計 4.1 の `monthly_train`）。
# **採用判定が現行モデルと比較するようになってから置いた**（詳細設計 4.6。v1.98）
# — それまでは `current_brier=None` を固定で渡しており、条件1〜2（現行より良く、
# 差が有意かつ 0.003 以上）が一度も課されていなかった。**その状態で定期実行すると
# 月次で悪いモデルが自動採用されうる。**
#
# **定期実行では登録まで行う。** `schedule` では `inputs` が空になるため、
# `github.event_name == 'schedule'` を先に見る（`daily-ingest` と同じ）。
# 版は `model_version` を省略すると `1.0.0` で、**同じ版を2回登録すると主キー違反で
# 落ちる**（4.5.1）。定期実行では**日付から版を作る**。
#
# 名前は `monthly-train` にせず `train` にしてある（手動では月次に限らない）。
#
# **`contents: read` のままにする**（基本設計 7.3）。特徴量のキャッシュ
# （`batch/cache/`）はコミットしない。
#
# **`--register` を既定にしない。** 登録は D1 の書き込み枠を使い、同じ版を2回
# 送ると主キー違反で落ちる（詳細設計 4.5.1）。評価だけを何度でも回せるようにする。
#
# **`--initial` の口を手動実行にだけ置く**（詳細設計 4.6。2026-10-09）。33本の世代を
# 初めて入れるときに要る — **勝敗モデルだけが先に本番にあり、中身が同じなので
# 「現行より 0.003 以上良い」を満たせない**。1本でも落ちると33本とも登録しないため
# （4.5.1）、選手の30本が永久に入らない状態になっていた。**定期実行では立てない** —
# 月次が毎回これを立てると、現行モデルとの比較が永久に行われない。
name: train

on:
  # 毎月1日 19:00 UTC = JST 2日 04:00（CLAUDE.md 時刻の扱い）。
  schedule:
    - cron: '0 19 1 * *'
  workflow_dispatch:
    inputs:
      register:
        description: '採用判定を通ったら登録して有効化する（D1 に33行書く）'
        required: false
        type: boolean
        default: false
      initial:
        description: '現行モデルと比較しない（初回登録。残りの関門は課す）'
        required: false
        type: boolean
        default: false
      model_version:
        description: '版（既定 1.0.0）。学習条件を変えたら上げる'
        required: false
        type: string
      dry_run:
        description: '登録の本文を組むが D1 には書かない'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# D1 へ書き込むジョブの同時実行を禁止する（詳細設計 4.1）。
concurrency:
  group: d1-write
  cancel-in-progress: false

jobs:
  train:
    # 手動実行も既定ブランチだけに限る。別ブランチのコードで本番 D1 へ書かない。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 設計 4.1 の `monthly_train` と同じ 120分。選手モデル16本を見込んだ値であり、
    # いまのチーム3本では数分で終わる。
    timeout-minutes: 120
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # 未設定のまま走らせない。**skip ではなく fail にする**（rebuild-derived と同じ）。
      # 評価だけのときも `InternalApi` を組まないため不要だが、**登録のつもりで
      # 回した実行が黙って評価だけで終わる**のを防ぐため常に要求する。
      - name: 設定の確認
        shell: bash
        run: |
          missing=()
          for name in API_BASE_URL INGEST_TOKEN; do
            [[ -z "${!name}" ]] && missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            printf '::error::未設定: %s\n' "${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      # **`requirements-dev.txt` も入れる。** リークテストを先に通すため pytest が要る
      # （`requirements.txt` には入っていない。CI と同じ組み合わせにする）。
      - run: pip install -r batch/requirements.txt -r batch/requirements-dev.txt

      # **リークテストを先に通す**（詳細設計 4.5 の `run_leakage_tests()`）。
      # 失敗したらモデル登録に到達させない（基本設計 7.2）。
      - name: リーク検証
        run: python -m pytest batch/tests/test_leakage.py -q

      # inputs を `run:` に直接展開しない（env へ渡す）。
      - name: 学習と評価
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          REGISTER: ${{ github.event_name == 'schedule' || inputs.register }}
          # **定期実行では立てない。** 月次が毎回これを立てると、現行モデルとの
          # 比較が永久に行われない（v1.97 まで黙って起きていた状態に戻る）
          INITIAL: ${{ github.event_name != 'schedule' && inputs.initial }}
          MODEL_VERSION: ${{ inputs.model_version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--json train-report.json)
          [[ "$REGISTER" == 'true' ]] && args+=(--register)
          [[ "$INITIAL" == 'true' ]] && args+=(--initial)
          if [[ "$SCHEDULED" == 'true' && -z "$MODEL_VERSION" ]]; then
            # **同じ版を2回登録すると主キー違反で落ちる**（詳細設計 4.5.1）。
            # 月次では日付から版を作る（例: 1.2026.1005）
            MODEL_VERSION="1.$(date -u +%Y).$(date -u +%m%d)"
            echo "train: 版を $MODEL_VERSION にした（定期実行）"
          fi
          [[ -n "$MODEL_VERSION" ]] && args+=(--model-version "$MODEL_VERSION")
          [[ "$DRY_RUN" == 'true' ]] && args+=(--dry-run)
          python -m batch.jobs.train "${args[@]}"

      # 評価の数値を持ち帰る。**`contents: read` のままコミットしない**ため、
      # `verification/RESULTS.md` への記録は人（または AI）が行う。
      - name: 評価の数値を上げる
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: train-report
          path: train-report.json
          if-no-files-found: warn
