name = "bpredict-api"
main = "src/index.ts"
# workerd の対応範囲を超える日付を書くとローカル実行が起動しない
# （"This Worker requires compatibility date ... but the newest date supported ..."）。
# wrangler を上げたときだけ前に進める。
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# **サイトと同じオリジンに置く**（詳細設計 3.5）。`/api/*` だけを Worker が受け、
# 残り（画面・静的JSON）は Pages が返す。CORS も CSP の追加設定も要らなくなる。
#
# `*.workers.dev` は残るが正本ではない。ゾーンを持たないため WAF もレートリミットも
# キャッシュルールも効かない（要件 4.1）。
# **`workers.dev` を残す。** `routes` を足すと既定で無効化され、旧URLが 404 になる。
# 独自ドメインの DNS が立つまでの経路がなくなり、バッチ（`API_BASE_URL`）も落ちる。
# 正本は独自ドメイン側だが、退避路として残す（要件 4.1）。
workers_dev = true

[[routes]]
pattern = "bpredict.naomaru.app/api/*"
zone_name = "naomaru.app"

# D1_DATABASE_ID は機密ではない（操作には API トークンが別途必要）ため直書きしてよい。
# `d1_databases` の必須フィールドは環境変数注入が効かない（基本設計 7.4）。
#
# 2026-09-22 に `wrangler d1 create bpredict --location apac` で作成した実物。
# `--local` のマイグレーションと `wrangler dev` はこの値を参照しないため、
# ローカル開発は実物が無くても動く。
#
# binding は `DB` のままにする（`wrangler d1 create` の出力は `bpredict` を
# 提案するが、コードは `env.DB` を参照している）。
[[d1_databases]]
binding = "DB"
database_name = "bpredict"
database_id = "6af3adc9-3f7f-4b10-b374-efde48e1339a"
migrations_dir = "../db/migrations"

# freeze は毎時。外部アクセスを必要としない純粋な D1 操作であり、
# スクレイピングの失敗に巻き込まれてはならない（基本設計 4.1）。
# cron は UTC で書く（CLAUDE.md 時刻の扱い）。
[triggers]
crons = ["0 * * * *"]
